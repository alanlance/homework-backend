spring:
  application:
    name: demo

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/taskdb?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${SPRING_DATASOURCE_USERNAME:taskuser}
    password: ${SPRING_DATASOURCE_PASSWORD:taskpass}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false

app:
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:true}
    name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
    topic: ${ROCKETMQ_TOPIC:rate-limit-events}
    tag: ${ROCKETMQ_TAG:exceeded}
    producer-group: ${ROCKETMQ_PRODUCER_GROUP:rate-limit-producer}
    consumer-group: ${ROCKETMQ_CONSUMER_GROUP:rate-limit-audit-consumer}
